<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AFVI — UI Prototype</title>
<style>
  :root {
    --bg:            #2d2d2f;   /* nav / sidebar / status / scrollbars        */
    --panel:         #36353a;   /* center stage, thumbs, spec tree, log, tabs */
    --panel2:        #303030;   /* Image-Analysis column background           */
    --nav-active:    #0079ca;
    --ready:         #9bcd32;
    --spec-hdr:      #da7092;
    --img-hdr:       #ffe4e2;
    --tab-unit:      #6495ec;
    --tab-dummy:     #add8e7;
    --light1:        #9470db;
    --light2:        #e7e6fb;
    --red-tab:       #c13635;
    --cream:         #ffe4c5;
    --sec-hdr:       #474747;   /* Global Align / SR Align header bars         */
    --overlay-hdr:   #cfcfcf;
    --yellow:        #ffc910;
    --green:         #00b050;
    --purple:        #6633fe;
    --text:          #e8e8e8;
    --text-muted:    #9a9a9a;
    --text-dim:      #6f6f72;
    --accent-green:  #9edb3c;   /* MODEL / LOT / STRIP values                  */
    --cell:          #36353a;
    --grid-red:      #d9494b;
    --line:          #4a4a4c;
    --scroll-thumb:  #545456;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 13px; color: var(--text);
    background: #000;
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }

  .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* =====================  TOP NAV  ===================== */
  .topnav {
    display: flex; height: 40px; flex: 0 0 40px;
    background: var(--bg); border-bottom: 1px solid #1a1a1b;
  }
  .nav-links { display: flex; flex: 1; }
  .nav-item {
    flex: 1; border: 0; background: var(--bg); color: var(--text);
    font-size: 15px; letter-spacing: .3px;
    border-right: 1px solid #202021; cursor: pointer;
  }
  .nav-item:hover { background: #35353a; }
  .nav-item.active { background: var(--nav-active); color: #fff; }
  .status-pill {
    flex: 0 0 29.5%; display: flex; align-items: center; justify-content: center;
    background: var(--ready); color: #1c2a05; font-size: 16px; font-weight: 400;
  }

  /* =====================  WORKSPACE  ===================== */
  .workspace { display: flex; flex: 1; min-height: 0; }

  /* left icon rail */
  .rail {
    flex: 0 0 52px; background: var(--bg); border-right: 1px solid #202021;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 0;
  }
  .rail-btn {
    width: 40px; height: 40px; border: 0; background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: #b9b9bb; border-radius: 4px;
  }
  .rail-btn:hover { background: #3a3a3f; color: #fff; }
  .rail-btn.active { color: #fff; }
  .rail-spacer { flex: 1; }
  .rail-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.4; }

  /* middle region (thumbs + center) with the log underneath */
  .mid { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .mid-top { display: flex; flex: 1; min-height: 0; }

  /* model / live thumbnail column */
  .thumbcol {
    flex: 0 0 180px; background: var(--panel); border-right: 1px solid #202021;
    display: flex; flex-direction: column; min-height: 0;
  }
  .thumb-pcb { flex: 0 0 58%; border-bottom: 1px solid #4a4a4c; padding: 2px; overflow: hidden; }
  .thumb-pcb svg { display: block; width: 100%; height: 100%; }
  .thumb-live { flex: 1; padding: 4px; overflow: hidden; display: flex; }
  .live-grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px;
    width: 78%; margin: 0 auto; align-content: start;
  }
  .live-cell { border: 1px solid var(--grid-red); background: transparent; height: 22px; }
  .live-cell.dim { border-color: #6e2f2f; }

  /* center column */
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); }

  .infobar {
    display: flex; align-items: center; flex: 0 0 54px;
    background: var(--bg); padding: 0 6px; gap: 4px;
  }
  .info-item { display: flex; align-items: center; height: 100%; padding: 0 10px; }
  .accent { width: 3px; height: 34px; background: var(--accent-green); margin-right: 8px; }
  .info-labels { display: flex; flex-direction: column; line-height: 1.15; }
  .info-label { font-size: 10px; color: var(--text-muted); }
  .info-value { font-size: 14px; color: var(--accent-green); }
  .info-sep { width: 1px; height: 34px; background: #3a3a3d; }

  .toolbar { display: flex; gap: 3px; padding: 0 12px; }
  .tool-group { display: flex; gap: 3px; padding: 2px; }
  .tb {
    width: 34px; height: 34px; border: 1px solid #4a4a4e; border-radius: 5px;
    background: #3a3a3e; display: flex; align-items: center; justify-content: center;
    color: #d0d0d2; padding: 0;
  }
  .tb:hover { background: #47474c; }
  .tb.active { border-color: #fff; }
  .tb svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.3; }
  .tb.gv { font-size: 12px; color: #d0d0d2; }

  /* swatch cluster */
  .sw-bulb.on { border-color: var(--yellow); color: var(--yellow); }
  .sw-ring.red    { border-color: #c13635; }
  .sw-ring.green  { border-color: #3fae4a; }
  .sw-ring.blue   { border-color: #2ea3d8; }
  .sw-ring.yellow { border-color: var(--yellow); }
  .sw-ring svg { width: 18px; height: 18px; }
  .sw-dot { width: 12px; height: 12px; border-radius: 50%; background: #c13635; }
  .sw-dot.green  { background: #3fae4a; }
  .sw-dot.blue   { background: #2ea3d8; }
  .sw-dot.yellow { background: var(--yellow); }
  .sw-chip { width: 15px; height: 15px; background: #29b6e8; }
  .tb.active.sw-chip-btn { border-color: #29b6e8; }

  /* image stage */
  .stage { flex: 1; background: var(--panel); position: relative; overflow: hidden; }

  /* empty separator band between the stage and the log */
  .statusbar {
    flex: 0 0 42px; background: var(--bg); border-top: 1px solid #202021;
  }

  /* log */
  .log {
    flex: 0 0 150px; background: var(--panel); border-top: 1px solid #202021;
    font-family: Consolas, 'Courier New', monospace; font-size: 11.5px;
    color: #cfcfd2; padding: 4px 10px; overflow-y: auto; line-height: 1.45;
    white-space: pre;
  }

  /* =====================  RIGHT PANEL  ===================== */
  .right { flex: 0 0 29%; min-width: 500px; display: flex; flex-direction: column; background: var(--panel); }

  .right-head { display: flex; flex: 0 0 54px; }
  .right-head .h {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #2a2a2a;
  }
  .right-head .h.spec { background: var(--spec-hdr); color: #3a1c28; }
  .right-head .h.ana  { background: var(--img-hdr); }

  .right-body { display: flex; flex: 1; min-height: 0; }
  .spec-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid #4a4a4c; }
  .ana-col  { flex: 1.28; min-width: 0; display: flex; flex-direction: column; background: var(--panel2); }

  /* ---- tab strips ---- */
  .tabs { display: flex; flex: 0 0 30px; }
  .tab {
    flex: 1; border: 0; border-right: 1px solid #4a4a4c; font-size: 13px; padding: 0;
    background: #3a3a3e; color: var(--text);
  }
  .tab.unit  { background: var(--tab-unit);  color: #fff; }
  .tab.dummy { background: var(--tab-dummy); color: #2b2b2b; }
  .spec-col .tab.active { box-shadow: inset 0 -3px 0 rgba(255,255,255,.85); }
  .ana-col .tab { background: var(--light2); color: #2b2b2b; }
  .ana-col .tab.active { background: var(--light1); color: #fff; }
  .colortabs .tab { background: var(--cream); color: #2b2b2b; }
  .colortabs .tab.red.active   { background: var(--red-tab); color: #fff; }
  .colortabs .tab.green.active { background: #3fae4a; color: #fff; }
  .colortabs .tab.blue.active  { background: #2ea3d8; color: #fff; }

  /* ---- align info block ---- */
  .align-block { padding: 4px 8px 6px; }
  .sec-hdr {
    background: var(--sec-hdr); color: #e6e6e6; font-size: 11.5px; font-weight: 600;
    padding: 2px 8px; margin: 3px 0; border-radius: 2px;
  }
  .align-row { display: flex; align-items: center; gap: 6px; padding: 2px 6px; font-size: 12px; }
  .align-row .k { color: #d8d8d8; width: 42px; }
  .align-row .v { color: #f0f0f0; width: 30px; }
  .align-row .k2 { color: #d8d8d8; width: 62px; }
  .align-row .chan { color: var(--accent-green); }
  .align-row select {
    background: #4a4a4e; color: #fff; border: 1px solid #5f5f63; border-radius: 2px;
    font-size: 12px; padding: 0 2px; outline: none;
  }
  .chan-blue { color: #7fb2e5; }
  .chan-red  { color: #e06a6a; }

  /* ---- overlay ---- */
  .overlay-hdr {
    background: var(--overlay-hdr); color: #232323; font-size: 11.5px; font-weight: 600;
    padding: 2px 8px; margin: 6px 8px 4px; width: fit-content; border-radius: 2px;
  }
  .ov-checks { display: flex; gap: 16px; padding: 2px 12px 4px; font-size: 12.5px; color: #dcdcdc; }
  .ov-checks label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .ov-checks .tick { color: #cfcfcf; width: 12px; }
  .ov-checks u { text-decoration: underline; }

  .selline { display: flex; align-items: center; gap: 8px; padding: 2px 12px 6px; font-size: 12.5px; }
  .selboard { color: #cfcfcf; }
  .dmg-box {
    background: #d8d8d8; color: #232323; border: 0; border-radius: 2px;
    padding: 2px 10px; min-width: 70px; display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px;
  }
  .dmg-box .caret { font-size: 9px; color: #444; }

  /* ---- tree ---- */
  .tree-wrap { flex: 1; min-height: 0; overflow: scroll; padding: 2px 8px 8px 14px; }
  .tree { list-style: none; margin: 0; padding: 0; }
  .tree ul.children {
    list-style: none; margin: 0; padding-left: 14px;
    border-left: 1px solid #8a8a8a; margin-left: 8px;
  }
  .node > .row { display: flex; align-items: center; position: relative; padding: 1px 0; }
  ul.children > .node > .row::before {
    content: ''; position: absolute; left: -14px; top: 50%;
    width: 14px; height: 1px; background: #8a8a8a;
  }
  .cb {
    width: 13px; height: 13px; flex: 0 0 13px; margin-right: 6px;
    background: #2b2b2d; border: 1px solid #c8c8c8; border-radius: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; line-height: 1;
  }
  .cb.on::after { content: '✓'; font-size: 11px; color: #f0f0f0; }
  .bar {
    background: var(--yellow); color: #171717; font-weight: 600; font-size: 12px;
    padding: 2px 8px; border-radius: 1px; min-width: 60px; display: inline-block;
  }
  .row.sel .bar { outline: 1px solid #fff; outline-offset: 1px; }
  .bar.green  { background: var(--green);  color: #06230f; }
  .bar.purple { background: var(--purple); color: #fff; }

  /* ---- image-analysis tables ---- */
  .ana-col .tbl-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tbl-block { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid #2a2a2a; }
  .tbl-block:last-child { flex: 1.15; border-bottom: 0; }
  table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.grid th {
    background: #363636; color: #d6d6d6; font-weight: 400; font-size: 12px;
    text-align: left; padding: 3px 8px; border: 1px solid #232323;
  }
  table.grid td { color: var(--accent-green); font-size: 12px; padding: 2px 8px; height: 22px; }
  table.grid th:nth-child(1), table.grid td:nth-child(1) { width: 22%; }
  table.grid th:nth-child(2), table.grid td:nth-child(2) { width: 48%; }
  table.grid th:nth-child(3), table.grid td:nth-child(3) { width: 30%; }
  .tbl-body { flex: 1; min-height: 0; overflow: auto; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: #2d2d2f; }
  ::-webkit-scrollbar-thumb { background: #55555a; border: 3px solid #2d2d2f; border-radius: 6px; }
  ::-webkit-scrollbar-corner { background: #2d2d2f; }
</style>
</head>
<body>
<div class="app">

  <!-- ================= TOP NAV ================= -->
  <header class="topnav">
    <nav class="nav-links" id="navLinks">
      <button class="nav-item" data-nav="home">HOME</button>
      <button class="nav-item active" data-nav="teach">TEACH</button>
      <button class="nav-item" data-nav="review">REVIEW</button>
      <button class="nav-item" data-nav="calibrate">CALIBRATE</button>
      <button class="nav-item" data-nav="settings">SETTINGS</button>
    </nav>
    <div class="status-pill">Ready</div>
  </header>

  <div class="workspace">

    <!-- ============ LEFT ICON RAIL ============ -->
    <aside class="rail" id="rail">
      <button class="rail-btn active" title="Info">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/><path d="M12 11v6"/></svg>
      </button>
      <button class="rail-btn" title="Inspect">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="10" r="7"/><path d="M16.5 15.5 21 20"/><path d="M4 10h3"/></svg>
      </button>
      <button class="rail-btn" title="Cut">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M7.6 16.4 17 4M16.4 16.4 7 4"/></svg>
      </button>
      <button class="rail-btn" title="3D">
        <svg viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
      </button>
      <button class="rail-btn" title="Sheets">
        <svg viewBox="0 0 24 24"><path d="M4 9l8-4 8 4-8 4z"/><path d="M4 13l8 4 8-4"/></svg>
      </button>
      <button class="rail-btn" title="Flow">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M12 7v3.5M11 11.6 6.6 16M13 11.6 17.4 16"/></svg>
      </button>
      <button class="rail-btn" title="Stack">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="7" rx="2"/><rect x="8" y="13" width="12" height="7" rx="2"/></svg>
      </button>
      <button class="rail-btn" title="Region">
        <svg viewBox="0 0 24 24"><path d="M4 8V4h5M10 4 6 12h5"/><circle cx="15" cy="14" r="4"/><path d="M18 17l3 3"/></svg>
      </button>
      <button class="rail-btn" title="Clip">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="13" height="12" rx="2"/><path d="M7 9h7M7 13h5"/></svg>
      </button>
      <button class="rail-btn" title="Docs">
        <svg viewBox="0 0 24 24"><path d="M5 6h4l1.5 2H19v9H5z"/><path d="M8 8l9 3-9 3z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="rail-btn" title="Search">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="11" height="12" rx="1"/><path d="M6 8h7M6 11h5"/><circle cx="16" cy="16" r="3.4"/><path d="M18.4 18.4 21 21"/></svg>
      </button>
      <button class="rail-btn" title="Tools">
        <svg viewBox="0 0 24 24"><path d="M14 4a4 4 0 0 0-3.7 5.5L4 15.8 8.2 20l6.3-6.3A4 4 0 0 0 20 10z"/><path d="M7 6l3 3M5 18l2-2"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" title="Select region">
        <svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>
      </button>
    </aside>

    <!-- ============ MIDDLE (thumbs + center + log) ============ -->
    <div class="mid">
      <div class="mid-top">

        <!-- model + live thumbnails -->
        <div class="thumbcol">
          <div class="thumb-pcb" id="pcbThumb" title="Model image"></div>
          <div class="thumb-live">
            <div class="live-grid" id="liveGrid"></div>
          </div>
        </div>

        <!-- center stage -->
        <div class="center">
          <div class="infobar">
            <div class="info-item">
              <div class="accent"></div>
              <div class="info-labels"><span class="info-label">MODEL :</span><span class="info-value">6SG0504A-00</span></div>
            </div>
            <div class="info-sep"></div>
            <div class="info-item">
              <div class="accent"></div>
              <div class="info-labels"><span class="info-label">LOT :</span><span class="info-value">B8789790401</span></div>
            </div>
            <div class="info-sep"></div>
            <div class="info-item">
              <div class="accent"></div>
              <div class="info-labels"><span class="info-label">STRIP :</span><span class="info-value">1</span></div>
            </div>
            <div style="flex:1"></div>

            <!-- toolbar -->
            <div class="toolbar" id="toolbar">
              <div class="tool-group">
                <button class="tb" title="Detect">
                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1" fill="currentColor" stroke="none"/></svg>
                </button>
                <button class="tb" title="Measure">
                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M7 9h3M7 12h4M7 15h3M13 9h4"/></svg>
                </button>
                <button class="tb gv" title="GV">GV</button>
                <button class="tb" title="ROI grid">
                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M15 4v16M4 9h16M4 15h16"/></svg>
                </button>
                <button class="tb" title="Layers">
                  <svg viewBox="0 0 24 24"><path d="M12 4 20 8l-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
                </button>
                <button class="tb" title="Match">
                  <svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M9 12h6"/></svg>
                </button>
                <button class="tb" title="Points">
                  <svg viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="7" cy="7" r="1.3"/><circle cx="12" cy="7" r="1.3"/><circle cx="17" cy="7" r="1.3"/><circle cx="7" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="17" cy="12" r="1.3"/><circle cx="7" cy="17" r="1.3"/><circle cx="12" cy="17" r="1.3"/><circle cx="17" cy="17" r="1.3"/></g></svg>
                </button>
                <button class="tb" title="Dots">
                  <svg viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="8" cy="8" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="8" cy="16" r="1"/><circle cx="12" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></g></svg>
                </button>
                <button class="tb" title="Columns">
                  <svg viewBox="0 0 24 24"><path d="M7 5v14M10 5v14M13 5v14M16 5v14"/></svg>
                </button>
                <button class="tb" title="Defect ROI">
                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.1" fill="currentColor" stroke="none"/></svg>
                </button>
                <button class="tb" title="Cells">
                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/><circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/></svg>
                </button>
              </div>

              <div class="tool-group" style="margin-left:26px">
                <button class="tb" title="Shape">
                  <svg viewBox="0 0 24 24"><path d="M8 7h9l-2 10H6z" fill="currentColor" stroke="none"/></svg>
                </button>
                <button class="tb sw-chip-btn" title="Color chip" data-color-chip>
                  <span class="sw-chip"></span>
                </button>
                <button class="tb sw-bulb on" title="Light 1" data-bulb>
                  <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 4a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9z"/><rect x="9.5" y="16" width="5" height="1.6" rx="0.8"/><path d="M10.5 19h3v1.2h-3z"/></svg>
                </button>
                <button class="tb sw-bulb" title="Light 2" data-bulb>

<script>
/* ============================================================
   AFVI UI prototype — interaction only, no functional backend.
   ============================================================ */

/* ---------- Model thumbnail: procedural PCB strip ---------- */
function drawPcb() {
  const host = document.getElementById('pcbThumb');
  const W = 168, H = 300;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2c6f9e"/><stop offset="0.5" stop-color="#3f9bc9"/><stop offset="1" stop-color="#2c6f9e"/>
      </linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="url(#bg)"/>`;
  // vertical panel columns of "cells"
  const cols = 6, rows = 14, cw = (W - 2) / cols, ch = (H - 2) / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = 1 + c * cw, y = 1 + r * ch;
      const on = ((r + c) % 3 !== 0);
      if (!on) continue;
      s += `<rect x="${(x + 0.6).toFixed(1)}" y="${(y + 0.6).toFixed(1)}" width="${(cw - 1.2).toFixed(1)}" height="${(ch - 1.2).toFixed(1)}"
              fill="#7fd6f2" fill-opacity="${0.35 + ((r * 7 + c * 3) % 5) * 0.1}" rx="1"/>`;
    }
  }
  // photo-style speckle
  for (let i = 0; i < 420; i++) {
    const x = (Math.sin(i * 12.9898) * 43758.5453) % 1;
    const y = (Math.sin(i * 78.233) * 12543.123) % 1;
    const px = Math.abs(x) * W, py = Math.abs(y) * H, rr = 0.4 + (i % 3) * 0.5;
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${rr}" fill="#dff4ff" fill-opacity="0.5"/>`;
  }
  // bright vertical divider lines
  for (let c = 1; c < cols; c++) {
    const x = 1 + c * cw;
    s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#cdeeff" stroke-width="0.7" stroke-opacity="0.55"/>`;
  }
  s += `</svg>`;
  host.innerHTML = s;
}

/* ---------- Live grid thumbnail ---------- */
function drawLiveGrid() {
  const host = document.getElementById('liveGrid');
  const cols = 8, rows = 15;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const d = document.createElement('div');
      d.className = 'live-cell' + ((r + c) % 7 === 0 ? ' dim' : '');
      host.appendChild(d);
    }
  }
}

/* ---------- Log panel ---------- */
function drawLog() {
  const ips = ['11', '14', '12', '13', '11', '12', '11', '12', '13', '11', '14', '13', '12'];
  const times = ['14:24:51', '14:24:52', '17:24:50', '17:24:51', '17:24:52',
                 '20:24:50', '20:24:51', '20:24:52', '20:24:52', '20:24:52',
                 '20:24:52', '20:24:52', '20:24:52'];
  const host = document.getElementById('log');
  host.textContent = times.map((t, i) =>
    `2026-10-12 ${t} KeepAlive IP:192.168.200.${ips[i]}, PORT2000`).join('\n');
  host.scrollTop = host.scrollHeight;
}

/* ---------- Overlay tree ---------- */
const TREE = [
  { name: 'AU',  cls: '',       children: ['C-Pad', 'B-Pad', 'L-Pad'] },
  { name: 'DSP', cls: '',       children: ['C-Pad', 'B-Pad', 'L-Pad'] },
  { name: 'Drill', cls: '',     children: ['Hole', 'Vent'] },
  { name: 'NonMetal', cls: 'green', children: ['SR All', 'Pattern1', 'PatternThick', 'Space1', 'SpaceThick', 'Open1', 'EtchBack', 'Laser Marking'] },
  { name: 'ETC', cls: 'purple', children: ['User Mask'] },
];

function buildTree() {
  const root = document.getElementById('tree');
  root.innerHTML = '';
  for (const g of TREE) {
    const li = document.createElement('li');
    li.className = 'node';
    li.innerHTML = `
      <div class="row">
        <span class="cb"></span><span class="bar ${g.cls}">${g.name}</span>
      </div>
      <ul class="children">
        ${g.children.map(n => `<li class="node"><div class="row"><span class="cb"></span><span class="bar ${g.cls}">${n}</span></div></li>`).join('')}
      </ul>`;
    root.appendChild(li);
  }
  root.querySelectorAll('.cb').forEach(cb => {
    cb.addEventListener('click', e => { e.stopPropagation(); cb.classList.toggle('on'); });
  });
  root.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => {
      const sel = root.querySelector('.row.sel');
      if (sel && sel !== row) sel.classList.remove('sel');
      row.classList.toggle('sel');
    });
  });
}

/* ---------- Generic helpers ---------- */
function wireTabs(container, activeClass, attr) {
  const el = document.getElementById(container);
  if (!el) return;
  el.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

/* ---------- Boot ---------- */
drawPcb();
drawLiveGrid();
drawLog();
buildTree();

/* nav tabs (visual only) */
document.querySelectorAll('#navLinks .nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#navLinks .nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
/* spec Unit/Dummy */
document.querySelectorAll('#specTabs .tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#specTabs .tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    b.classList.toggle('unit', b.dataset.specTab === 'unit');
    b.classList.toggle('dummy', b.dataset.specTab === 'dummy');
  });
});
/* light tabs */
wireTabs('lightTabs');
/* color tabs */
wireTabs('colorTabs');

/* rail icons: single active */
document.getElementById('rail').addEventListener('click', e => {
  const btn = e.target.closest('.rail-btn');
  if (!btn) return;
  document.querySelectorAll('#rail .rail-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

/* toolbar buttons: active toggle on the icon group */
document.querySelectorAll('#toolbar .tb').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.bulb !== undefined) {        // bulbs: single-active toggle
      document.querySelectorAll('[data-bulb]').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      return;
    }
    if (btn.dataset.ring !== undefined) {        // rings: single-active toggle
      const on = btn.classList.contains('active');
      document.querySelectorAll('[data-ring]').forEach(b => b.classList.remove('active'));
      if (!on) btn.classList.add('active');
      return;
    }
    btn.classList.toggle('active');
  });
});

/* overlay checkboxes are handled in buildTree for tree; top row here */
document.querySelectorAll('.ov-checks label').forEach(l => {
  l.addEventListener('click', () => l.querySelector('.cb').classList.toggle('on'));
});

/* DMG dropdown: visual drop list */
document.getElementById('dmgBox').addEventListener('click', function () {
  const existing = document.getElementById('dmgList');
  if (existing) { existing.remove(); return; }
  const list = document.createElement('div');
  list.id = 'dmgList';
  list.style.cssText = 'position:absolute;background:#d8d8d8;color:#232323;border:1px solid #999;font-size:12.5px;z-index:5;min-width:70px;';
  ['DMG', 'SR', 'METAL'].forEach(t => {
    const it = document.createElement('div');
    it.textContent = t;
    it.style.cssText = 'padding:2px 10px;cursor:pointer;';
    it.onmouseenter = () => it.style.background = '#b9d4ea';
    it.onmouseleave = () => it.style.background = 'transparent';
    it.onclick = () => { this.firstChild.textContent = t + ' '; list.remove(); };
    list.appendChild(it);
  });
  this.parentElement.style.position = 'relative';
  this.parentElement.appendChild(list);
  list.style.top = '100%';
  list.style.left = '20px';
});
</script>
